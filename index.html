<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หาหมอ — Pet Service Finder</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#173330;
    --teal-900:#0F3D38;
    --teal-700:#1F5C54;
    --teal-100:#DCEAE6;
    --sage-50:#EEF3EE;
    --card:#FFFFFF;
    --amber:#F2A93B;
    --amber-ink:#5C3E0B;
    --coral:#E85B4F;
    --line:#D8E3DF;
    --muted:#6B837D;
    --open:#2E8B57;
    --closed:#C6493D;
    --radius:14px;
    --shadow:0 2px 10px rgba(15,61,56,0.07), 0 1px 2px rgba(15,61,56,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Inter','Noto Sans Thai',sans-serif;
    background:var(--sage-50);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    min-height:640px;
  }

  /* ---- Header / ticket strip ---- */
  header{
    background:var(--teal-900);
    color:#fff;
    padding:16px 20px 14px;
    position:relative;
    overflow:hidden;
    flex-shrink:0;
  }
  header::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:6px;
    background-image: radial-gradient(circle, var(--sage-50) 3px, transparent 3.5px);
    background-size: 16px 6px;
    background-position: 4px 0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .mark{
    width:34px;height:34px;border-radius:50%;
    background:var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    flex-shrink:0;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.12);
  }
  .brand h1{
    font-family:'Fredoka','Noto Sans Thai',sans-serif;
    font-weight:600;
    font-size:22px;
    margin:0;
    letter-spacing:0.2px;
  }
  .brand p{
    margin:1px 0 0;
    font-size:12px;
    color:#AFC9C3;
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.4px;
  }

  .search-row{
    margin-top:14px;
    display:flex;
    gap:8px;
  }
  .search-box{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:11px;
    padding:9px 12px;
  }
  .search-box:focus-within{
    border-color:var(--amber);
    background:rgba(255,255,255,0.14);
  }
  .search-box input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:#fff;
    font-size:14px;
    font-family:inherit;
  }
  .search-box input::placeholder{color:#9FBAB3;}
  .search-box svg{flex-shrink:0;opacity:0.8;}

  .chips{
    display:flex;
    gap:7px;
    margin-top:11px;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    display:flex; align-items:center; gap:6px;
    white-space:nowrap;
    padding:6px 12px 6px 9px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.06);
    color:#D9EAE6;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    user-select:none;
    transition:all .15s ease;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .chip.active{
    background:var(--amber);
    border-color:var(--amber);
    color:var(--amber-ink);
  }
  .chip:hover:not(.active){background:rgba(255,255,255,0.14);}

  /* ---- Body: list + map ---- */
  .body{
    flex:1;
    display:flex;
    min-height:0;
  }
  .list-pane{
    width:400px;
    max-width:44vw;
    flex-shrink:0;
    overflow-y:auto;
    padding:14px;
    border-right:1px solid var(--line);
    background:var(--sage-50);
  }
  .result-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.6px;
    margin:2px 4px 10px;
  }
  .map-pane{
    flex:1;
    position:relative;
    min-width:0;
  }
  #map{
    position:absolute; inset:0;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:13px 14px;
    margin-bottom:10px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .12s ease, border-color .12s ease;
  }
  .card:hover{transform:translateY(-1px); border-color:var(--teal-700);}
  .card.selected{
    border-color:var(--amber);
    box-shadow:0 0 0 2px rgba(242,169,59,0.35), var(--shadow);
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .card-title{
    display:flex;
    align-items:center;
    gap:7px;
  }
  .cat-icon{
    width:26px;height:26px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;flex-shrink:0;
  }
  .card-name{
    font-weight:700;
    font-size:14.5px;
    line-height:1.3;
  }
  .status-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    font-weight:500;
    padding:3px 7px;
    border-radius:6px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .status-pill.open{background:#E4F3EA; color:var(--open);}
  .status-pill.closed{background:#FBEAE8; color:var(--closed);}

  .card-address{
    font-size:12px;
    color:var(--muted);
    margin:6px 0 8px;
    line-height:1.4;
    padding-left:33px;
  }
  .card-meta{
    display:flex;
    align-items:center;
    gap:12px;
    padding-left:33px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--teal-700);
  }
  .card-meta a{color:inherit; text-decoration:none;}
  .card-meta a:hover{text-decoration:underline;}
  .rating{
    color:var(--amber-ink);
    background:#FBF1DD;
    padding:1px 6px;
    border-radius:5px;
    font-weight:600;
  }

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
    font-size:13px;
  }

  .leaflet-popup-content-wrapper{
    border-radius:10px;
    font-family:'Inter','Noto Sans Thai',sans-serif;
  }
  .popup-name{font-weight:700; font-size:13px; margin-bottom:3px;}
  .popup-meta{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--teal-700);}

  .pin{
    width:30px;height:30px;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    display:flex;align-items:center;justify-content:center;
    border:2px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,0.3);
  }
  .pin span{transform:rotate(45deg); font-size:13px;}

  @media (max-width: 760px){
    .body{flex-direction:column;}
    .list-pane{width:100%; max-width:100%; max-height:46%; border-right:none; border-bottom:1px solid var(--line);}
    .map-pane{flex:1;}
  }

  :focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="mark">🐾</div>
      <div>
        <h1>หาหมอ</h1>
        <p>PET SERVICE FINDER · BANGKOK</p>
      </div>
    </div>
    <div class="search-row">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="ค้นหาชื่อร้าน, เขต, ถนน...">
      </div>
    </div>

  </header>

  <div class="body">
    <div class="list-pane">
      <div class="result-count" id="resultCount">แสดงผล 0 แห่ง</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  { id:16, cat:"shop", name:"JJ Pet Market (จตุจักร)", address:"ตลาดจตุจักร เขตจตุจักร", phone:null, lat:13.802346, lng:100.550179, rating:4.3, always:true, hoursText:"เปิด 24 ชม. (สัตว์เลี้ยง+อุปกรณ์+อาหารครบวงจร)" },
  { id:17, cat:"shop", name:"ร้านปุ๊กเพ็ทช็อป", address:"69 ถ.วุฒากาศ บางค้อ จอมทอง", phone:"+66 85 130 5495", lat:13.704474, lng:100.467758, rating:4.8, open:[7,30],close:[21,30], hoursText:"07:30–21:30 ทุกวัน" },
  { id:18, cat:"shop", name:"ออสติน เพ็ทช็อป", address:"96 ถ.เพชรเกษมสายเก่า ปากคลอง ภาษีเจริญ", phone:"+66 2 457 1845", lat:13.723987, lng:100.463712, rating:4.0, open:[7,0],close:[22,0], hoursText:"07:00–22:00 ทุกวัน (อาหารสุนัข แมว หนู กระต่าย ชูก้าไกลเดอร์)" },
  { id:19, cat:"shop", name:"ร้านลูกน้ำราชวัตร", address:"909 ถ.นครไชยศรี ดุสิต", phone:"+66 82 554 4526", lat:13.778462, lng:100.524421, rating:4.0, open:[6,0],close:[19,0], hoursText:"06:00–19:00 ทุกวัน" },

/* ============================================================
   OPEN/CLOSED LOGIC (simple, based on hoursText patterns above)
   ============================================================ */
function isOpenNow(p){
  if(p.always) return true;
  if(!p.open) return null; // unknown
  const now = new Date();
  const day = now.getDay(); // 0=Sun
  if(p.closedDays && p.closedDays.includes(day)) return false;
  const mins = now.getHours()*60 + now.getMinutes();
  const openMins = p.open[0]*60+p.open[1];
  const closeMins = p.close[0]*60+p.close[1];
  if(closeMins > openMins){
    return mins >= openMins && mins <= closeMins;
  } else {
    return mins >= openMins || mins <= closeMins;
  }
}

/* ============================================================
   STATE
   ============================================================ */
let activeCats = new Set(Object.keys(CATEGORIES));
let query = "";
let selectedId = null;
let markers = {};

/* ============================================================
   RENDER: chips
   ============================================================ */
const chipsEl = document.getElementById('chips');
function renderChips(){
  chipsEl.innerHTML = "";
  Object.entries(CATEGORIES).forEach(([key, c])=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeCats.has(key) ? ' active':'');
    chip.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.icon} ${c.label}`;
    chip.onclick = ()=>{
      if(activeCats.has(key)) activeCats.delete(key); else activeCats.add(key);
      renderChips(); renderList(); renderMarkers();
    };
    chipsEl.appendChild(chip);
  });
}

/* ============================================================
   RENDER: list
   ============================================================ */
const listEl = document.getElementById('list');
const countEl = document.getElementById('resultCount');

function filteredPlaces(){
  const q = query.trim().toLowerCase();
  return PLACES.filter(p=>{
    if(!activeCats.has(p.cat)) return false;
    if(q && !(p.name.toLowerCase().includes(q) || p.address.toLowerCase().includes(q))) return false;
    return true;
  });
}

function renderList(){
  const items = filteredPlaces();
  countEl.textContent = `แสดงผล ${items.length} แห่ง`;
  listEl.innerHTML = "";
  if(items.length === 0){
    listEl.innerHTML = `<div class="empty">ไม่พบร้านที่ตรงกับการค้นหา<br>ลองเปลี่ยนคำค้นหรือเลือกหมวดหมู่อื่น</div>`;
    return;
  }
  items.forEach(p=>{
    const cat = CATEGORIES[p.cat];
    const open = isOpenNow(p);
    const card = document.createElement('div');
    card.className = 'card' + (p.id === selectedId ? ' selected':'');
    card.innerHTML = `
      <div class="card-top">
        <div class="card-title">
          <div class="cat-icon" style="background:${cat.color}22">${cat.icon}</div>
          <div class="card-name">${p.name}</div>
        </div>
        ${open===null ? '' : `<div class="status-pill ${open?'open':'closed'}">${open?'เปิดอยู่':'ปิดแล้ว'}</div>`}
      </div>
      <div class="card-address">${p.address}<br>${p.hoursText}</div>
      <div class="card-meta">
        ${p.phone ? `<a href="tel:${p.phone.replace(/\s/g,'')}">📞 ${p.phone}</a>` : '<span>ไม่มีเบอร์โทร</span>'}
        <span class="rating">★ ${p.rating.toFixed(1)}</span>
      </div>
    `;
    card.onclick = ()=> selectPlace(p.id);
    listEl.appendChild(card);
  });
}

/* ============================================================
   MAP
   ============================================================ */
const map = L.map('map', { zoomControl:true }).setView([13.7563, 100.5018], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

function makeIcon(cat, isSelected){
  const c = CATEGORIES[cat];
  return L.divIcon({
    className: '',
    html: `<div class="pin" style="background:${c.color}; ${isSelected?'transform:rotate(-45deg) scale(1.25); z-index:999;':''}"><span>${c.icon}</span></div>`,
    iconSize: [30,30],
    iconAnchor: [15,29],
    popupAnchor: [0,-26],
  });
}

function renderMarkers(){
  Object.values(markers).forEach(m=>map.removeLayer(m));
  markers = {};
  filteredPlaces().forEach(p=>{
    const marker = L.marker([p.lat,p.lng], { icon: makeIcon(p.cat, p.id===selectedId) })
      .addTo(map)
      .bindPopup(`<div class="popup-name">${CATEGORIES[p.cat].icon} ${p.name}</div><div class="popup-meta">${p.hoursText}<br>${p.phone || 'ไม่มีเบอร์โทร'}</div>`);
    marker.on('click', ()=> selectPlace(p.id, false));
    markers[p.id] = marker;
  });
}

function selectPlace(id, panMap=true){
  selectedId = id;
  renderList();
  renderMarkers();
  const p = PLACES.find(x=>x.id===id);
  if(p && panMap){
    map.flyTo([p.lat,p.lng], 15, { duration: 0.6 });
    markers[id].openPopup();
  }
  const el = document.querySelector('.card.selected');
  if(el) el.scrollIntoView({ block:'nearest', behavior:'smooth' });
}

   SEARCH INPUT
   ============================================================ */
document.getElementById('searchInput').addEventListener('input', (e)=>{
  query = e.target.value;
  selectedId = null;
  renderList();
  renderMarkers();
});
